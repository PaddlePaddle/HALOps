name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--from-ref` needs the merge base between the PR and its target.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so hook behaviour does not drift with the runner's latest release.
      - run: python -m pip install pre-commit==4.7.0

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-4.7.0|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # PRs only check the files they touch, so unrelated legacy files and
      # pre-existing style debt cannot block review.
      - name: pre-commit (changed files)
        if: github.event_name == 'pull_request'
        run: >-
          pre-commit run --show-diff-on-failure --color=always
          --from-ref "${{ github.event.pull_request.base.sha }}"
          --to-ref "${{ github.event.pull_request.head.sha }}"

      # Every merge into main re-checks the whole tree, so a hook or config
      # upgrade cannot silently leave the baseline unformatted.
      - name: pre-commit (all files)
        if: github.event_name == 'push'
        run: pre-commit run --all-files --show-diff-on-failure --color=always
