name: ut

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The runner owns a single GPU slot, so a newer run on the same ref replaces
# the older one instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gpu-test:
    runs-on: [self-hosted, halops-unittest]
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: "3"
      LD_LIBRARY_PATH: /home/opt/nvidia_lib:/usr/local/nccl:/usr/local/lib:/usr/local/openmpi-4.1.5/lib:/usr/lib/x86_64-linux-gnu:/usr/lib:/usr/lib64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A fresh venv per run keeps dependencies in step with requirements.txt
      # and leaves the host Python, shared with other runners, untouched.
      - name: Set up venv
        run: |
          python -m venv --clear "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Environment
        run: |
          nvidia-smi
          python -c "import sys, torch; print(sys.executable); print(torch.__version__, torch.version.cuda)"

      - name: Build
        run: bash build.sh

      # A hung kernel otherwise holds the GPU until the job-level timeout.
      # test_latent_moe.py is skipped because it hangs on the CI GPU since #21.
      - name: Test
        timeout-minutes: 30
        run: python -m pytest -v tests/ --ignore=tests/test_latent_moe.py
